<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1730">
<title>Join Atraski</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1730'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23FF8A5C'%3EAP%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#F4F6FA;--surface:#fff;--sunk:#F0F2F7;--ink:#121A2F;--muted:#5D667C;--line:#E2E6EE;--brand:#0F1730;--accent:#E8572A;--ok:#0B7A5C;--okbg:#E3F4EE;--warn:#B45309;--warnbg:#FEF3E2;--bad:#C2362B;--badbg:#FDECEC;--r:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}

.req{color:var(--bad)}
.sec{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.sec h3{margin:0;font-size:15px}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.banner{border-radius:12px;padding:12px 14px;background:var(--warnbg);color:#5B3A06;font-size:14px}
.banner.ok{background:var(--okbg);color:#064E3B} .banner.bad{background:var(--badbg);color:#7F1D1D}
.letter{border:1px solid var(--line);border-radius:12px;padding:22px 26px;background:#fff}
.letter .lt{text-align:center;font-weight:800;margin:12px 0 4px;letter-spacing:.04em}
.letter .lp{white-space:pre-line;margin:8px 0}
.letter .lh{font-weight:700;margin:14px 0 4px}
.letter table{border-collapse:collapse;width:100%;font-size:14px}
.letter td{border:1px solid #D7DCE6;padding:6px 9px} .letter td:first-child{background:#F4F6FA;font-weight:600;width:40%}
.letter .ln{font-size:12.5px;color:var(--muted);font-style:italic}
.letter .ls{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#121A2F;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);z-index:9;box-shadow:0 18px 40px -18px rgba(16,24,40,.4)}
[hidden]{display:none!important}
@media print{header,.noprint,.toast{display:none!important} body{background:#fff} .panel{border:0;box-shadow:none}}
</style>
</head>
<body>
<header><div class="in"><div class="mark" aria-hidden="true">AP</div><div><b>Atraski People</b><span>Joining Atraski India · At Buzz</span></div></div></header>

<script>
(() => {

function steps(){

  const list = [["1. Your details & documents", s1], ["2. Letter of Intent", s2], ["3. Joining", s3]];

}
function letter(blocks, sign){
  return h("div", { class:"letter" }, h("div", { style:"font-weight:800;color:#0F1730;font-size:17px", text:"ATRASKI INDIA" }), h("div", { class:"muted", style:"font-size:11px;border-bottom:1px solid #D7DCE6;padding-bottom:8px", text:"Atraski India · At Buzz" }),
    ...(blocks || []).map(b => b.t === "title" ? h("div", { class:"lt", text:b.text }) : b.t === "h" ? h("div", { class:"lh", text:b.text }) : b.t === "note" ? h("div", { class:"ln", text:b.text }) : b.t === "sign" ? h("div", { class:"ls", text:b.text })

    sign ? h("div", { class:"ls", text: sign }) : null);
}
async function act(body, okMsg){ if (busy) return; busy = true; render(); try { V = await call(body); if (okMsg) toast(okMsg); } catch (e) { toast(e.message); } finally { busy = false; render(); } }
function upload(key){

    h("div", { class:"panel" }, h("h2", { text:"Your details" }), h("p", { class:"muted", text:"Only Atraski's CEO sees these. We don't ask for bank account numbers or your full Aadhaar number here." }),

      h("div", { class:"row" }, h("button", { class:"btn", disabled: busy, onclick: () => { const x = read(); draft = {}; act({ act:"save", details: x }, "Saved"); }, text: busy ? "Saving…" : "Save" }))),
    h("div", { class:"panel" }, h("h2", { text:"Your documents" }), h("p", { class:"muted", text:"PDF or a clear photo, up to 8 MB each. They go straight into Atraski's private Drive folder for you." }),

        h("div", { class:"row" }, h("span", { class:"pill" + (docs[k] ? " ok" : ""), text: docs[k] ? "Uploaded" : "Missing" }), h("button", { class:"btn sm", disabled: busy, onclick: () => upload(k), text: docs[k] ? "Replace" : "Upload" }))))),
    h("div", { class:"panel" }, h("h2", { text:"Send to Atraski" }), h("p", { class:"muted", text: miss ? `${miss} required document${miss === 1 ? " is" : "s are"} still missing.` : "Everything is uploaded. Save your details, then send." }),
      h("div", { class:"row" }, h("button", { class:"btn primary", disabled: busy, onclick: async () => { const x = read(); if (busy) return; busy = true; render(); try { V = await call({ act:"save", details: x }); draft = {}; V = await call({ act:"submit" }); toast("Sent. We'll get back to you soon."); } catch (e) { toast(e.message); } finally { busy = false; render(); } }, text: busy ? "Sending…" : "Save and send" })))];
}

</script>
